<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lista de Pizzas</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.2.1/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<body>
<header>
    <nav>
        <h1>Lista de Pizzas</h1>
        <button onclick="document.getElementById('id01').style.display='block'" class="btn btn-info">Adcionar +</button>
        <div class="w3-container">

            <div id="id01" class="w3-modal">
                <div class="w3-modal-content">
                    <div class="w3-container">
                        <span onclick="document.getElementById('id01').style.display='none'" class="w3-button w3-display-topright">&times;</span>
                        <h2>Adicionar um novo café</h2>

                        <div>
                            <div class="form-group">
                                <div class="form-group">
                                    <label for="precoPizza">Preço</label>
                                    <input type="number" step="0.01" class="form-control" id="precoPizza" placeholder="0.00">
                                </div>
                                <div class="form-group">
                                    <label for="categoriaPizza">Categoria</label>
                                    <input type="text" class="form-control" id="categoriaPizza" placeholder="Ex: Tradicional, Especial">
                                </div>
                                <label for="exampleInputEmail1">ID da pizza</label>
                                <input type="text" class="form-control" id="inputID" disabled="true">
                                <div class="form-group">
                                    <label for="exampleInputEmail1">Nome da Pizza</label>
                                    <input type="text" class="form-control" id="nomePizza" aria-describedby="emailHelp" placeholder="Nome">
                                </div>
                                <button id="submitBtn" class="btn btn-primary">Adicionar</button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
    </nav>

</header>

<main class="jumbotron">

    <ul id="pizza-list">

    </ul>
</main>

</body>
<script src="index.js"></script>
</html>
